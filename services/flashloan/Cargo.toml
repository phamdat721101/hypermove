[package]
name = "hypermove-flashloan-engine"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "flashloan-engine"
path = "native/main.rs"

[dependencies]
revm = { version = "=19.7.0", default-features = false, features = ["std", "secp256k1", "portable"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
